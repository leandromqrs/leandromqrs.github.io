<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">VM resource monitor architecture</title><desc id="d">The browser polls the QWControl module, which caches hypervisor data, stores hourly metrics and produces reports.</desc><defs><marker id="ar8b958a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8b958a"/></marker><marker id="ar46e07c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#46e07c"/></marker><marker id="ar6cb6ff" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6cb6ff"/></marker><marker id="are8b84a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#e8b84a"/></marker></defs><rect width="1200" height="520" fill="#0b0d0b"/><text x="30" y="36" font-size="14" fill="#46e07c" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">$ vm-monitor --architecture</text><rect x="30" y="90" width="220" height="150" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="30" y="90" width="3" height="150" fill="#6cb6ff"/><text x="44" y="112" font-size="13" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Browser</text><text x="44" y="130" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Vue interface</text><text x="44" y="146" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">VM cards, filters,</text><text x="44" y="162" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">resource charts</text><rect x="30" y="290" width="220" height="120" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="30" y="290" width="3" height="120" fill="#8b958a"/><text x="44" y="312" font-size="13" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Operator</text><text x="44" y="330" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">watches status,</text><text x="44" y="346" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">powers VMs on and off,</text><text x="44" y="362" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">exports reports</text><rect x="340" y="70" width="360" height="400" fill="#131613" stroke="#46e07c" stroke-width="1.2" stroke-dasharray="6 4"/><text x="360" y="96" font-size="14" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">virtual-automator module</text><rect x="360" y="116" width="320" height="58" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="360" y="116" width="3" height="58" fill="#46e07c"/><text x="374" y="138" font-size="12.5" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Feature license check</text><text x="374" y="156" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">module on only when licensed</text><rect x="360" y="190" width="320" height="58" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="360" y="190" width="3" height="58" fill="#46e07c"/><text x="374" y="212" font-size="12.5" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Hypervisor manager</text><text x="374" y="230" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">one adapter per hypervisor</text><rect x="360" y="264" width="320" height="58" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="360" y="264" width="3" height="58" fill="#46e07c"/><text x="374" y="286" font-size="12.5" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Cache</text><text x="374" y="304" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">repeated polls skip the hypervisor</text><rect x="360" y="338" width="320" height="58" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="360" y="338" width="3" height="58" fill="#46e07c"/><text x="374" y="360" font-size="12.5" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Hourly metrics job</text><text x="374" y="378" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">stores CPU, memory, disk, network</text><rect x="360" y="412" width="320" height="44" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="360" y="412" width="3" height="44" fill="#46e07c"/><text x="374" y="434" font-size="12.5" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Report generator</text><text x="374" y="452" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Jasper PDF reports</text><rect x="790" y="90" width="380" height="120" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="790" y="90" width="3" height="120" fill="#e8b84a"/><text x="804" y="112" font-size="13" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Hypervisors</text><text x="804" y="130" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">VMware vSphere API</text><text x="804" y="146" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Proxmox API</text><rect x="790" y="260" width="380" height="90" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="790" y="260" width="3" height="90" fill="#e8b84a"/><text x="804" y="282" font-size="13" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Metrics storage</text><text x="804" y="300" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">hourly samples of each resource</text><rect x="790" y="390" width="380" height="66" fill="#131613" stroke="#2f3830" stroke-width="1.2"/><rect x="790" y="390" width="3" height="66" fill="#e8b84a"/><text x="804" y="412" font-size="13" fill="#dfe5dc" text-anchor="start" font-weight="700" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">Report files</text><text x="804" y="430" font-size="11.5" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">generated on demand</text><path d="M140,240 L140,290" stroke="#8b958a" stroke-width="1.6" fill="none" marker-end="url(#ar8b958a)"/><path d="M250,150 L340,150" stroke="#6cb6ff" stroke-width="1.6" fill="none" marker-end="url(#ar6cb6ff)"/><text x="301.0" y="146.0" font-size="11" fill="#8b958a" text-anchor="start" font-weight="400" font-family="'JetBrains Mono','DejaVu Sans Mono',ui-monospace,monospace">poll</text><path d="M340,200 L250,200" stroke="#6cb6ff" stroke-width="1.6" fill="none" marker-end="url(#ar6cb6ff)" stroke-dasharray="5 4"/><path d="M680,219 L790,150" stroke="#e8b84a" stroke-width="1.6" fill="none" marker-end="url(#are8b84a)"/><path d="M680,367 L790,305" stroke="#e8b84a" stroke-width="1.6" fill="none" marker-end="url(#are8b84a)"/><path d="M680,434 L790,423" stroke="#e8b84a" stroke-width="1.6" fill="none" marker-end="url(#are8b84a)"/><path d="M790,170 L680,230" stroke="#e8b84a" stroke-width="1.6" fill="none" marker-end="url(#are8b84a)" stroke-dasharray="5 4"/></svg>